<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Clear 3D Telegram Messenger</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000205;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #38bdf8;
            font-family: monospace;
            font-size: 20px;
            letter-spacing: 3px;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="loading">RENDERING 4K QUANTUM INTERFACE...</div>
    <canvas id="webgl-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SETUP SCENE ---
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000205, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 11);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Retina / High-DPI qo'llab-quvvatlash

        // --- 2. ULTRA-HD 4K CANVAS TEXTURE FOR CRISP UI ---
        let likeCount = 256;
        const uiCanvas = document.createElement('canvas');
        uiCanvas.width = 4096;  // O'ta yuqori aniqlik (hiriralashib ketmasligi uchun)
        uiCanvas.height = 2048;
        const ctx = uiCanvas.getContext('2d');

        function drawCrispUI() {
            ctx.clearRect(0, 0, 4096, 2048);

            // Fon (Dark Glassmorphism)
            ctx.fillStyle = 'rgba(3, 7, 18, 0.94)';
            ctx.beginPath();
            ctx.roundRect(40, 40, 4016, 1968, 40);
            ctx.fill();

            // Yorqin Neon ramka
            ctx.strokeStyle = '#00e1ff';
            ctx.lineWidth = 10;
            ctx.stroke();

            // --- HEADER ---
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 90px sans-serif';
            ctx.fillText('⚡ TELEGRAM 3D QUANTUM DESKTOP', 160, 220);

            ctx.fillStyle = '#00e1ff';
            ctx.font = 'bold 45px sans-serif';
            ctx.fillText('SECURE WEBGL ENVIRONMENT // ENCRYPTED NODE.JS', 160, 310);

            // Ajratuvchi chiziq
            ctx.strokeStyle = 'rgba(0, 225, 255, 0.4)';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(160, 380);
            ctx.lineTo(3936, 380);
            ctx.stroke();

            // --- CHAT GROUPS SIDEBAR ---
            ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
            ctx.beginPath();
            ctx.roundRect(160, 460, 1000, 1340, 30);
            ctx.fill();

            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 60px sans-serif';
            ctx.fillText('Aktiv Guruhlar', 240, 580);

            // Active Group Item
            ctx.fillStyle = 'rgba(0, 140, 255, 0.3)';
            ctx.beginPath();
            ctx.roundRect(220, 650, 880, 200, 25);
            ctx.fill();
            ctx.strokeStyle = '#008cff';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 55px sans-serif';
            ctx.fillText('🚀 Full-Stack Developers', 280, 745);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '40px sans-serif';
            ctx.fillText('Umidjon: WebGL o\'ta tiniq qilindi...', 280, 810);

            // --- MESSAGES AREA ---
            ctx.fillStyle = 'rgba(8, 12, 24, 0.98)';
            ctx.beginPath();
            ctx.roundRect(1220, 460, 2716, 1020, 30);
            ctx.fill();

            // Message 1
            ctx.fillStyle = 'rgba(30, 41, 59, 0.9)';
            ctx.beginPath();
            ctx.roundRect(1320, 560, 1600, 180, 25);
            ctx.fill();
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 42px sans-serif';
            ctx.fillText('Azizbek', 1400, 630);
            ctx.fillStyle = '#f1f5f9';
            ctx.font = '45px sans-serif';
            ctx.fillText('Aka, yozuvlar endi xiralashmayaptimi?', 1400, 700);

            // Message 2
            ctx.fillStyle = 'rgba(0, 110, 255, 0.5)';
            ctx.beginPath();
            ctx.roundRect(2000, 780, 1850, 180, 25);
            ctx.fill();
            ctx.fillStyle = '#00e1ff';
            ctx.font = 'bold 42px sans-serif';
            ctx.fillText('Umidjon (You)', 2080, 850);
            ctx.fillStyle = '#ffffff';
            ctx.font = '45px sans-serif';
            ctx.fillText('4K resolution va crisp filter orqali tiniq qilindi!', 2080, 920);

            // --- ACTION BUTTONS (LIKE & LINK) ---
            // Like Button
            ctx.fillStyle = '#1e3a8a';
            ctx.beginPath();
            ctx.roundRect(1220, 1550, 1200, 250, 30);
            ctx.fill();
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 60px sans-serif';
            ctx.fillText(`❤️ LIKE BOSISH (${likeCount})`, 1550, 1705);

            // Redirect App Link Button
            ctx.fillStyle = '#047857';
            ctx.beginPath();
            ctx.roundRect(2470, 1550, 1466, 250, 30);
            ctx.fill();
            ctx.strokeStyle = '#10b981';
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 55px sans-serif';
            ctx.fillText('🚀 VERCEL ILOVAGA O\'TISH ➔', 2760, 1705);
        }

        drawCrispUI();

        // 4K Teksturani o'ta tiniq chiqishi uchun sozlamalar
        const uiTexture = new THREE.CanvasTexture(uiCanvas);
        uiTexture.minFilter = THREE.LinearFilter;
        uiTexture.magFilter = THREE.LinearFilter;
        uiTexture.generateMipmaps = false;

        const planeGeo = new THREE.PlaneGeometry(12, 6, 32, 32);
        const planeMat = new THREE.MeshBasicMaterial({ 
            map: uiTexture, 
            side: THREE.DoubleSide 
        });
        const uiMesh = new THREE.Mesh(planeGeo, planeMat);
        scene.add(uiMesh);

        // --- 3. BACKGROUND GLOW PARTICLES ---
        const particlesCount = 2000;
        const particlesGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 30;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.035,
            color: 0x00e1ff,
            transparent: true,
            opacity: 0.8
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Hide loading
        setTimeout(() => {
            const loader = document.getElementById('loading');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 500);
        }, 600);

        // --- 4. RAYCASTING FOR INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(uiMesh);

            if (intersects.length > 0) {
                const uv = intersects[0].uv;
                const x = uv.x * 4096;
                const y = (1 - uv.y) * 2048;

                // Like Button Zonasi
                if (x >= 1220 && x <= 2420 && y >= 1550 && y <= 1800) {
                    likeCount++;
                    drawCrispUI();
                    uiTexture.needsUpdate = true;
                }

                // Vercel Link Zonasi -> https://telegram-clone-web.vercel.app
                if (x >= 2470 && x <= 3936 && y >= 1550 && y <= 1800) {
                    window.open('https://telegram-clone-web.vercel.app', '_blank');
                }
            }
        });

        // --- 5. ANIMATION & PARALLAX ---
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0006;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0006;
        });

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            uiMesh.rotation.y += (mouseX - uiMesh.rotation.y) * 0.05;
            uiMesh.rotation.x += (mouseY - uiMesh.rotation.x) * 0.05;
            uiMesh.position.y = Math.sin(time * 2) * 0.08;

            particlesMesh.rotation.y = time * 0.03;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
